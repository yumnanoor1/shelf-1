<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Shelf</h1>
    <p class="sub">Books you want to read, are reading, and have finished. Click a spine to move it along.</p>

    <form id="add">
      <input id="title" placeholder="Title" required maxlength="120">
      <input id="author" placeholder="Author" maxlength="80">
      <button>Add book</button>
    </form>
    <p id="error" role="alert"></p>

    <div class="legend">
      <span class="to-read">To read</span>
      <span class="reading">Reading</span>
      <span class="done">Done</span>
    </div>

    <section id="shelf" aria-live="polite"></section>
    <p id="empty" hidden>Your shelf is empty. Add the first book above.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
